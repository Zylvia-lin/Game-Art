# ============================================
# GameArt AI - Docker Compose
# 一键启动: docker compose up -d
# ============================================

services:
  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: gameart-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameart123}
      POSTGRES_DB: ${POSTGRES_DB:-game_art_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameart} -d ${POSTGRES_DB:-game_art_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Python FastAPI 后端 ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gameart-backend
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-gameart}
      DB_PASSWORD: ${DB_PASSWORD:-gameart123}
      DB_NAME: ${DB_NAME:-game_art_ai}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Next.js 前端 ---
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: gameart-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
